<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1117;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9900;stop-opacity:1" />  <!-- AWS Orange -->
      <stop offset="33%" style="stop-color:#0089d6;stop-opacity:1" />   <!-- Azure Blue -->
      <stop offset="66%" style="stop-color:#4285f4;stop-opacity:1" />   <!-- GCP Blue -->
      <stop offset="100%" style="stop-color:#326ce5;stop-opacity:1" />  <!-- K8s Blue -->
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-gradient)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#grid)"/>
  
  <!-- Top accent bar -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent-gradient)"/>
  <rect x="0" y="636" width="1280" height="4" fill="url(#accent-gradient)"/>
  
  <!-- Left decorative element -->
  <circle cx="120" cy="320" r="180" fill="url(#accent-gradient)" fill-opacity="0.05" filter="url(#glow)"/>
  
  <!-- Main text content -->
  <text x="640" y="220" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="700" fill="#e6edf3" letter-spacing="-1">
    Priya Ranjan Sahu
  </text>
  
  <text x="640" y="285" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#0e75b6">
    Multi-Cloud DevOps & Security Engineer
  </text>
  
  <!-- Cloud provider badges row -->
  <g transform="translate(640, 340)">
    <!-- AWS -->
    <rect x="-260" y="-18" width="100" height="36" rx="6" fill="#ff9900" opacity="0.9"/>
    <text x="-210" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">AWS</text>
    
    <!-- Azure -->
    <rect x="-140" y="-18" width="110" height="36" rx="6" fill="#0089d6" opacity="0.9"/>
    <text x="-85" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Azure</text>
    
    <!-- GCP -->
    <rect x="-10" y="-18" width="100" height="36" rx="6" fill="#4285f4" opacity="0.9"/>
    <text x="40" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">GCP</text>
    
    <!-- Kubernetes -->
    <rect x="110" y="-18" width="130" height="36" rx="6" fill="#326ce5" opacity="0.9"/>
    <text x="175" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Kubernetes</text>
    
    <!-- Terraform -->
    <rect x="260" y="-18" width="120" height="36" rx="6" fill="#623ce4" opacity="0.9"/>
    <text x="320" y="8" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="white">Terraform</text>
  </g>
  
  <!-- Tagline -->
  <text x="640" y="410" text-anchor="middle" font-family="'Fira Code', 'Monaco', 'Consolas', monospace" font-size="18" fill="#8b949e" font-style="italic">
    "One cloud is a choice. Three clouds is a strategy."
  </text>
  
  <!-- Bottom links row -->
  <g transform="translate(640, 480)">
    <a href="https://github.com/priyaranjan-sahu" target="_blank">
      <rect x="-280" y="-16" width="140" height="32" rx="4" fill="#24292e" stroke="#30363d" stroke-width="1"/>
      <text x="-210" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#e6edf3">GitHub</text>
    </a>
    
    <a href="https://www.linkedin.com/in/priyaranjan-sahu/" target="_blank">
      <rect x="-120" y="-16" width="140" height="32" rx="4" fill="#0077b5" stroke="#006097" stroke-width="1"/>
      <text x="-50" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="white">LinkedIn</text>
    </a>
    
    <a href="https://linwintech.blogspot.com/" target="_blank">
      <rect x="40" y="-16" width="140" height="32" rx="4" fill="#ff5722" stroke="#e64a19" stroke-width="1"/>
      <text x="110" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="white">Blog</text>
    </a>
    
    <a href="https://github.com/sponsors/priyaranjan-sahu" target="_blank">
      <rect x="200" y="-16" width="140" height="32" rx="4" fill="#ea4aaa" stroke="#d03aa0" stroke-width="1"/>
      <text x="270" y="5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="white">Sponsor</text>
    </a>
  </g>
  
  <!-- Subtle corner accents -->
  <path d="M 40 600 L 40 560 80 560" fill="none" stroke="url(#accent-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 1240 600 L 1240 560 1200 560" fill="none" stroke="url(#accent-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 40 40 L 40 80 80 80" fill="none" stroke="url(#accent-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 1240 40 L 1240 80 1200 80" fill="none" stroke="url(#accent-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
</svg>