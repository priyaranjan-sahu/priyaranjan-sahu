name: GitHub Metrics

on:
  # Daily update
  schedule:
    - cron: "0 0 * * *"
  # Manual trigger
  workflow_dispatch:
  # Update on push to main
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: priyaranjan-sahu
          filename: github-metrics.svg
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_message: "chore: update GitHub metrics [skip ci]"
          base: header, repositories, metadata
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: Asia/Kolkata
          plugins_errors_fatal: no
          retries: 3
          retries_output_action: 5